name: Deploy to Cloudflare Workers

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      deployments: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npx vitest --run

      - name: Typecheck
        run: npm run typecheck

      - name: Scan for committed secrets
        run: npm run scan-secrets

      - name: Test the credential scanner itself
        run: npm run test:scan-secrets

      # 僅在推送到 main 時部署。
      # pull_request 事件只跑上面的測試——否則任何 PR 都會把該分支的程式碼
      # 部署到正式 Worker。
      - name: Deploy to Cloudflare Workers
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          # 部署一律使用最新發佈的 wrangler。
          #
          # 必須明寫 'latest'：wrangler-action 的文件說明，若省略這個輸入而環境
          # 中已經有 wrangler，它會沿用既有安裝 —— 而上面的 npm ci 已經依
          # package-lock.json 裝好一份，所以省略反而會變成「用 lockfile 鎖定的
          # 版本」，不是最新版。
          #
          # 代價（已知並接受）：上面的測試跑的是 lockfile 裡那份 wrangler，
          # 部署用的是另一份。所以最新版若有破壞性變更，測試不會攔到，第一個
          # 出問題的地方就是這個部署步驟。將來若不想承擔 major 版跳版風險，
          # 把值改成 '4' 即可 —— 一樣自動拿 4.x 最新，但不會跨到 v5。
          wranglerVersion: 'latest'
          command: deploy
